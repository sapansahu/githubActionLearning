name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Get code from repo
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
    #   - name: Lint code
    #     run: npm run lint || echo "No lint script, skipping lint."
      - name: Test code
        run: npm run test
  build:
    needs: test
    runs-on: windows-latest
    outputs:
      file-name: ${{ steps.publish.outputs.file-name }}
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Publish the js file names
        id: publish
        shell: bash
        run: |
          files=$(find dist/assets -maxdepth 1 -name '*.js' -type f | xargs -n1 basename | tr '\n' ' ')
          echo "file-name=$files" >> $GITHUB_OUTPUT
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
        #   path: |
        #     dist
        #     package.json
  deploy:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with: 
          name: dist-files
      - name: Output contents
        run: ls
      - name: Output fIlename
        run: echo "${{ needs.build.outputs.file-name }}"
      - name: Deploy
        run: echo "Deploying..."
